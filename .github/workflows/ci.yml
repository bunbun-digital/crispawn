name: Source tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: cargo +1.95.0 test --locked --manifest-path examples/crispawn/rust/Cargo.toml
      - run: python3 -m pip install -r tools/requirements-config-contract.txt
      - run: python3 test/config/crispawn-config-contract.test.py
      - run: python3 test/config/crispawn-media-contract.test.py
      - run: python3 test/config/crispawn-startup.test.py
      - run: python3 tools/check-community.py

