[package]
workspace = "../.."
name = "perfect-backup-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
perfect-backup-core.workspace = true
serde.workspace = true
sha2.workspace = true
blake3 = { version = "=1.8.2", features = ["rayon"] }
rayon = "=1.11.0"
serde_json = "=1.0.154"
csv = "=1.4.0"
zstd = { version = "=0.13.3", default-features = false }
xz2 = { version = "=0.1.7", features = ["static"] }
flate2 = { version = "=1.1.11", default-features = false, features = ["rust_backend"] }
libc = "=0.2.191"
tempfile = "=3.15.0"

[[bin]]
name = "perfect-backup-engine"
path = "src/main.rs"

[[bin]]
name = "perfect-backup"
path = "src/cui.rs"

[[bin]]
name = "perfect-backup-live"
path = "src/live_cli.rs"
