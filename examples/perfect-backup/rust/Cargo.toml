[workspace]
members = ["crates/core", "crates/engine", "crates/demo-model", "crates/demo-ui", "crates/live-ui"]
default-members = ["crates/core", "crates/engine", "crates/demo-model"]
resolver = "2"

[workspace.package]
version = "2.0.0"
edition = "2021"
rust-version = "1.82"
publish = false
license = "Apache-2.0"

[workspace.dependencies]
bunbun-ui = { path = "../../../sdk/rust/bunbun-ui" }
perfect-backup-demo-model = { path = "crates/demo-model" }
perfect-backup-core = { path = "crates/core" }
serde = { version = "=1.0.229", features = ["derive"] }
sha2 = "=0.10.9"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Exercise full-sized 8/16 MiB frames without disabling test safety checks.
[profile.test]
opt-level = 1
debug-assertions = true
overflow-checks = true
